name: Update recent contributions
on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/contributions.yml
permissions:
  contents: write
concurrency:
  group: recent-contributions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate calendar from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_contributions.py
      - name: Save updated calendar
        run: |
          git add assets/recent-contributions.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update recent contribution calendar'
          git pull --rebase origin main
          git push origin HEAD:main
